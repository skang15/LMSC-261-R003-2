<!doctype html>
<html lang="en">
<head>
    <title>Security System</title>
    <style>
        body {
            font-family: "Courier New", Courier, monospace;
            text-align: center;
            padding: 50px;
            background-color: #1a1a1a;
            color: white;
        }
        .profile-card {
            border: 2px solid #ff4444;
            padding: 20px;
            border-radius: 15px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="profile-card">
        <h1 id="status">Access Denied</h1>
        <p class="hackedStatus">Hacked by... Sara</p>
    </div>

  <script>
    // MISSION: Write your override code below
    let statusElement = document.getElementById("status");
    statusElement.textContent = "Access Granted";
    
    let cardElement = document.querySelector(".profile-card");
    cardElement.style.borderColor = "#208120";

    let hackedElement = document.querySelector(".hackedStatus");
    hackedElement.textContent = "Hacked by... Sara";

</script>
</body>
</html>
